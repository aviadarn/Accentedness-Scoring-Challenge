[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "accent-score"
version = "0.1.0"
description = "Phone-level American-English accentedness scoring"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "gradio==6.20.0",
    "gruut==2.4.0",
    "numpy>=2.0,<3",
    "safetensors>=0.5,<1",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "soundfile>=0.13,<1",
    "torch==2.12.1",
    "transformers==5.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
include = ["accent_score*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
